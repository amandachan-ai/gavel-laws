<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Agency layer: the principal delegates a goal and authority to the agent; the agent runs an observe, decide, act loop on the world">
  <defs><marker id="cl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f675d"/></marker></defs>
  <rect x="0" y="0" width="900" height="350" rx="14" fill="#fffdf8"/>
  <rect x="195" y="22" width="520" height="200" rx="16" fill="#e8efe9" stroke="#44695a" stroke-dasharray="6 5"/>
  <text x="700" y="46" text-anchor="end" font-size="15" font-weight="700" fill="#44695a">Agent</text>
  <rect x="20" y="38" width="140" height="64" rx="12" fill="#f4e4dc" stroke="#a84f36"/>
  <text x="90" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#29251f">Principal</text>
  <text x="90" y="88" text-anchor="middle" font-size="13" fill="#6f675d">who delegates</text>
  <line x1="160" y1="66" x2="378" y2="66" stroke="#6f675d" stroke-width="2" marker-end="url(#cl-a)"/>
  <text x="205" y="57" font-size="13" fill="#a84f36">delegates goal + authority</text>
  <rect x="380" y="40" width="150" height="50" rx="10" fill="#fffdf8" stroke="#a84f36"/>
  <text x="455" y="71" text-anchor="middle" font-size="17" font-weight="700" fill="#29251f">Goal</text>
  <line x1="455" y1="90" x2="455" y2="138" stroke="#6f675d" stroke-width="2" marker-end="url(#cl-a)"/>
  <rect x="215" y="140" width="130" height="50" rx="10" fill="#fffdf8" stroke="#44695a"/>
  <text x="280" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#29251f">Observe</text>
  <rect x="390" y="140" width="130" height="50" rx="10" fill="#fffdf8" stroke="#44695a"/>
  <text x="455" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#29251f">Decide</text>
  <rect x="565" y="140" width="130" height="50" rx="10" fill="#fffdf8" stroke="#44695a"/>
  <text x="630" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#29251f">Act</text>
  <line x1="345" y1="165" x2="388" y2="165" stroke="#6f675d" stroke-width="2" marker-end="url(#cl-a)"/>
  <line x1="520" y1="165" x2="563" y2="165" stroke="#6f675d" stroke-width="2" marker-end="url(#cl-a)"/>
  <rect x="355" y="270" width="200" height="60" rx="12" fill="#efe9de" stroke="#6f675d"/>
  <text x="455" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#29251f">World</text>
  <text x="455" y="318" text-anchor="middle" font-size="13" fill="#6f675d">files, systems, people</text>
  <path d="M630,190 L630,300 L557,300" fill="none" stroke="#6f675d" stroke-width="2" marker-end="url(#cl-a)"/>
  <path d="M353,300 L280,300 L280,192" fill="none" stroke="#6f675d" stroke-width="2" marker-end="url(#cl-a)"/>
  <text x="640" y="250" font-size="13" fill="#6f675d">changes the world</text>
  <text x="270" y="250" text-anchor="end" font-size="13" fill="#6f675d">sees real results</text>
</svg>
